<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fishing Party 3D v2.0</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#f4f8ff;background:#071e32}canvas{display:block;position:fixed;inset:0;z-index:0}#hud{position:relative;z-index:1;pointer-events:none;min-height:100vh;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.panel{background:#09283cdb;border:1px solid #ffffff38;border-radius:20px;padding:18px;backdrop-filter:blur(10px);box-shadow:0 8px 30px #00182760;pointer-events:auto}h1{margin:0 0 10px;font-size:27px}h2{margin:0 0 12px;font-size:20px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}.right{width:270px}.bottom{display:flex;justify-content:center;gap:10px;align-items:end}.bottom .panel{text-align:center;min-width:290px}button{background:#f8c95c;color:#102739;border:0;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;font-size:16px}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;padding:12px;margin:5px 0 12px;border-radius:10px;border:1px solid #7899a6;background:#f3fbff;color:#173447;font-size:16px}.muted{color:#c6dae3;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff22}.highlight{color:#f8d16a}.modal{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#031824a8;padding:18px}.modal .panel{width:min(440px,100%)}.hidden{display:none!important}#toast{position:fixed;z-index:4;top:100px;left:50%;transform:translateX(-50%);background:#0d3448e8;border-radius:15px;padding:12px 20px;pointer-events:none;opacity:0;transition:opacity .2s}#toast.show{opacity:1}.logo{font-weight:900;color:#ffdf83;font-size:24px}#status{font-size:19px;font-weight:800;margin:8px 0}#ranking{max-height:320px;overflow:auto}@media(max-width:650px){#hud{padding:10px}.top{gap:8px}.top .panel{padding:12px}.right{width:170px}.logo{font-size:16px}.right h2{font-size:16px}.bottom .panel{min-width:0;width:100%}h1{font-size:22px}}
#controls{position:fixed;bottom:145px;left:18px;z-index:2;background:#082b3ac9;border-radius:12px;padding:9px 12px;color:#fff;font-size:13px;pointer-events:none}#hud{pointer-events:none}#hud button,#hud input{pointer-events:auto}@media(max-width:650px){#controls{bottom:145px;font-size:11px}} </style></head><body><div id="hud"><div class="top"><div class="panel"><div class="logo">🎣 Fishing Party 3D v2.0</div><div id="roomLabel" class="muted">尚未加入房間</div><div id="timer" class="highlight">等待開始</div></div><div class="panel right"><h2>🏆 即時排行榜</h2><div id="ranking" class="muted">等待玩家加入</div></div></div><div class="bottom"><div class="panel"><div id="status">歡迎來到釣魚湖！</div><div id="hint" class="muted">WASD 移動｜滑鼠拖曳旋轉視角｜Shift 加速</div><div style="margin-top:12px"><button id="cast" disabled>🎣 拋竿釣魚</button> <button id="start" class="hidden">開始比賽</button></div></div></div></div><div id="controls">WASD 移動 · Shift 快跑 · 滑鼠拖曳轉視角 · 滾輪縮放</div><div id="toast"></div><div class="modal" id="login"><div class="panel"><h1>🌊 多人釣魚大賽</h1><p class="muted">和朋友在同一座 3D 湖泊釣魚，三分鐘內爭奪最高分！</p><label>玩家名稱</label><input id="name" maxlength="16" placeholder="你的暱稱" value="釣魚高手"><label>房號（留空即建立新房間）</label><input id="room" maxlength="5" placeholder="例如 A1B2C"><button id="join" style="width:100%">進入釣魚場</button><p id="error" style="color:#ffaaa0"></p><p class="muted">支援 2～8 人，同一房號即可連線。房主可以開始比賽。</p></div></div><script src="/socket.io/socket.io.js"></script><script type="module" src="/game.js"></script></body></html>
